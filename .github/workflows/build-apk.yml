name: Build KASI JADI Mobile APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare APK File
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/KASI-JADI-Mobile.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/SI-CKP-Mobile.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kasi-jadi-mobile-apk
          path: build/app/outputs/flutter-apk/KASI-JADI-Mobile.apk

      - name: Publish GitHub Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "KASI JADI Mobile v1.4.0 (Android APK)"
          body: "Unduh file **KASI-JADI-Mobile.apk** (atau **SI-CKP-Mobile.apk**) untuk menginstal aplikasi KASI JADI (Jurnal Aktivitas & Kinerja) di HP Android Anda."
          files: |
            build/app/outputs/flutter-apk/KASI-JADI-Mobile.apk
            build/app/outputs/flutter-apk/SI-CKP-Mobile.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
