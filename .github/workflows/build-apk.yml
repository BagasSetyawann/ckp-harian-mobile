name: Build SI-CKP Mobile APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Platform Files & Inject Permissions
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp -r lib /tmp/lib
          flutter create . --project-name si_ckp_mobile --platforms=android
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf lib test
          cp -r /tmp/lib lib
          # Pastikan izin INTERNET ada di AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          fi
          # Paksa compileSdk >= 36 untuk semua plugin (fix error AAR metadata file_picker)
          cp ci/force_sdk.gradle android/force_sdk.gradle
          if [ -f android/build.gradle.kts ]; then
            sed -i '1i apply(from = "force_sdk.gradle")' android/build.gradle.kts
            head -n 3 android/build.gradle.kts
          else
            sed -i '1i apply from: "force_sdk.gradle"' android/build.gradle
            head -n 3 android/build.gradle
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: si-ckp-mobile-apk
          path: build/app/outputs/flutter-apk/app-release.apk
