// Paksa semua plugin Android (mis. file_picker) dikompilasi dengan compileSdk >= 36.
// Dibutuhkan karena flutter_plugin_android_lifecycle versi terbaru mensyaratkan compileSdk 36.
// File ini di-apply di baris PALING ATAS android/build.gradle(.kts) oleh GitHub Actions,
// sehingga hook afterEvaluate terdaftar sebelum plugin Android Gradle mengunci konfigurasi.
def MIN_COMPILE_SDK = 36

subprojects { p ->
    if (p.state.executed) return
    p.afterEvaluate {
        def android = p.extensions.findByName('android')
        if (android == null) return
        try {
            def current = android.compileSdk
            if (current == null || current < MIN_COMPILE_SDK) {
                android.compileSdk = MIN_COMPILE_SDK
                p.logger.lifecycle("[force_sdk] ${p.name}: compileSdk ${current} -> ${MIN_COMPILE_SDK}")
            }
        } catch (Throwable e) {
            p.logger.warn("[force_sdk] Gagal set compileSdk untuk ${p.name}: ${e.message}")
        }
    }
}

